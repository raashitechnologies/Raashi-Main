[project]
name = "raashi-backend-worker"
version = "0.1.0"
description = "Cloudflare Worker running FastAPI for Raashi Cognitive Technologies"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.14.0b2",
    "bcrypt>=5.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.1",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
