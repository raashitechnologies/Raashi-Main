<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raashi Cognitive Technologies Pvt. Ltd. | Transforming Knowledge into Intelligent Solutions</title>
    <meta name="description" content="Raashi Cognitive Technologies delivers innovative solutions in Artificial Intelligence, IoT, Smart Automation, Engineering Design, Research & Development, and Education Training in Belgaum, Karnataka." />
    <meta name="author" content="Raashi Cognitive Technologies Pvt. Ltd." />



    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Preload Exo 2 bold italic for intro loader -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700&display=swap" as="style" />
  </head>
  <body>
    <!-- Branded intro loader — only on first visit per session -->
    <div id="raashi-intro-loader" aria-hidden="true">
      <div class="intro-glow"></div>
      <img src="/logo.png" alt="" class="intro-logo" width="140" height="140" />
      <div class="intro-line"></div>
      <div class="intro-wordmark" aria-label="RAASHI COGNITIVE TECHNOLOGIES">
        <span class="intro-letter" style="animation-delay:.55s">R</span><span class="intro-letter" style="animation-delay:.60s">A</span><span class="intro-letter" style="animation-delay:.65s">A</span><span class="intro-letter" style="animation-delay:.70s">S</span><span class="intro-letter" style="animation-delay:.75s">H</span><span class="intro-letter" style="animation-delay:.80s">I</span><span class="intro-letter" style="animation-delay:.88s">&nbsp;</span><span class="intro-letter" style="animation-delay:.90s">C</span><span class="intro-letter" style="animation-delay:.93s">O</span><span class="intro-letter" style="animation-delay:.96s">G</span><span class="intro-letter" style="animation-delay:.99s">N</span><span class="intro-letter" style="animation-delay:1.02s">I</span><span class="intro-letter" style="animation-delay:1.05s">T</span><span class="intro-letter" style="animation-delay:1.08s">I</span><span class="intro-letter" style="animation-delay:1.11s">V</span><span class="intro-letter" style="animation-delay:1.14s">E</span><span class="intro-letter" style="animation-delay:1.20s">&nbsp;</span><span class="intro-letter" style="animation-delay:1.22s">T</span><span class="intro-letter" style="animation-delay:1.25s">E</span><span class="intro-letter" style="animation-delay:1.28s">C</span><span class="intro-letter" style="animation-delay:1.31s">H</span><span class="intro-letter" style="animation-delay:1.34s">N</span><span class="intro-letter" style="animation-delay:1.37s">O</span><span class="intro-letter" style="animation-delay:1.40s">L</span><span class="intro-letter" style="animation-delay:1.43s">O</span><span class="intro-letter" style="animation-delay:1.46s">G</span><span class="intro-letter" style="animation-delay:1.49s">I</span><span class="intro-letter" style="animation-delay:1.52s">E</span><span class="intro-letter" style="animation-delay:1.55s">S</span>
      </div>
      <div class="intro-tagline">Transforming Knowledge into Intelligent Solutions</div>
    </div>
    <script>
      // Hide loader immediately if already seen this session
      (function() {
        if (sessionStorage.getItem('raashi_loaded')) {
          var el = document.getElementById('raashi-intro-loader');
          if (el) { el.style.display = 'none'; }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
