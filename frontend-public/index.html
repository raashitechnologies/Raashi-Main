<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raashi Cognitive Technologies Pvt. Ltd. | Transforming Knowledge into Intelligent Solutions</title>
    <meta name="description" content="Raashi Cognitive Technologies delivers innovative solutions in Artificial Intelligence, IoT, Smart Automation, Engineering Design, Research & Development, and Education Training in Belgaum, Karnataka." />
    <meta name="author" content="Raashi Cognitive Technologies Pvt. Ltd." />



    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Preload Exo 2 bold italic for intro loader -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700&display=swap" />
  </head>
  <body>
    <!-- Branded intro loader — only on first visit per session -->
    <div id="raashi-intro-loader" aria-hidden="true">
      <div class="intro-glow"></div>
      <div class="intro-ring"></div>
      <img src="/loader-icon.png" alt="Raashi" class="intro-logo" style="opacity:0" />
      <div class="intro-line"></div>
      <div class="intro-wordmark" aria-label="RAASHI">
        <span class="intro-letter" style="animation-delay:.7s">R</span><span class="intro-letter" style="animation-delay:.78s">A</span><span class="intro-letter" style="animation-delay:.86s">A</span><span class="intro-letter" style="animation-delay:.94s">S</span><span class="intro-letter" style="animation-delay:1.02s">H</span><span class="intro-letter" style="animation-delay:1.10s">I</span>
      </div>
      <div class="intro-tagline">Transforming Knowledge into Intelligent Solutions</div>
    </div>
    <script>
      // Hide loader immediately if already seen this session
      (function() {
        if (sessionStorage.getItem('raashi_loaded')) {
          var el = document.getElementById('raashi-intro-loader');
          if (el) { el.style.display = 'none'; }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
